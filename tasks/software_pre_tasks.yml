---

# Shared by software.yml and deploy_dle_cloud.yml: variables, version checks, base packages and
# the stored agent token. Imported statically, so the tags below behave as they did in pre_tasks.

- name: Include main variables
  ansible.builtin.include_vars: "{{ playbook_dir }}/vars/main.yml"
  tags: always

- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ playbook_dir }}/vars/{{ ansible_os_family }}.yml"
  tags: always

- name: Checking ansible version
  ansible.builtin.fail:
    msg: "Ansible version must be {{ minimal_ansible_version }} or higher"
  delegate_to: localhost
  when: ansible_version.full is version(minimal_ansible_version, '<')
  tags: always

- name: Checking DBLab Engine version
  ansible.builtin.fail:
    msg: "DBLab Engine version must be {{ minimal_dblab_engine_version }} or higher"
  when: dblab_engine_version | regex_replace('^v', '') | regex_replace('-rc.+$', '') is version(minimal_dblab_engine_version, '<')
  tags: always

- name: Checking Linux distribution
  ansible.builtin.fail:
    msg: "{{ ansible_distribution }} is not supported"
  when: ansible_distribution not in os_valid_distributions
  tags: always

- name: Checking version of OS Linux
  ansible.builtin.fail:
    msg: "{{ ansible_distribution_version }} of {{ ansible_distribution }} is not supported"
  when: ansible_distribution_version is version_compare(os_minimum_versions[ansible_distribution], '<')
  tags: always

- name: Confirm that necessary variables are set
  ansible.builtin.debug:
    msg:
      - "Some required variables have empty values."
      - "Specify values for variables: 'platform_project_name', 'platform_org_key'."
      - "For questions, contact Postgres.ai: https://postgres.ai/contact."
  failed_when: platform_project_name | length < 1 or platform_org_key | length < 1
  when: platform_project_name | length < 1 or platform_org_key | length < 1
  tags: always

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  register: apt_status
  until: apt_status is success
  delay: 10
  retries: 3
  when: ansible_os_family == "Debian"

- name: Ensure gnupg, gpg-agent, and apt-transport-https packages are present
  ansible.builtin.apt:
    pkg:
      - gnupg
      - gpg-agent
      - apt-transport-https
    state: present
  register: apt_status
  until: apt_status is success
  delay: 10
  retries: 3
  when: ansible_os_family == "Debian"

# Reads back the Platform access token this server already holds, before any
# role renders a configuration file with it. Play-level because both the
# engine config and the agent config are rendered from it, and the engine
# config is rendered first. 'always' so that a '--tags dblab-agent' switch
# of an already-installed server sees it too.
- name: Read the DBLab agent's stored Platform access token
  ansible.builtin.include_role:
    name: dblab-agent
    tasks_from: read_token.yml
    apply:
      tags: always  # without this the included tasks are filtered out by --tags
  when: dblab_agent_install | bool
  tags: always

- name: Ensure 'set backupcopy=yes' is in ~/.vimrc
  ansible.builtin.lineinfile:
    path: "~{{ username }}/.vimrc"
    line: 'set backupcopy=yes'
    create: true  # This will create the file if it doesn't exist
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0600"

...
