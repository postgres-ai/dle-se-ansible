---
- name: Render server.yml
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../roles/dblab-engine/templates/server.yml.j2"
    dest: "{{ render_dir }}/server.yml"
    mode: "0600"
  vars:
    platform_project_name: "p"
    platform_org_key: "k"
    dblab_cloud_source_host: "{{ case.vars.dblab_cloud_source_host }}"
    dblab_cloud_source_port: "{{ case.vars.dblab_cloud_source_port | default(5432) }}"
    dblab_cloud_source_dbname: "{{ case.vars.dblab_cloud_source_dbname | default('postgres') }}"
    dblab_cloud_source_username: "{{ case.vars.dblab_cloud_source_username | default('postgres') }}"
    dblab_cloud_source_password: "{{ case.vars.dblab_cloud_source_password }}"
    dblab_cloud_postgres_version: "{{ case.vars.dblab_cloud_postgres_version | default('17') }}"
    dblab_engine_db_image: "{{ case.vars.dblab_engine_db_image | default(role_defaults.dblab_engine_db_image) }}"
    dblab_cloud_dump_custom_options: "{{ case.vars.dblab_cloud_dump_custom_options | default(role_defaults.dblab_cloud_dump_custom_options) }}"
    dblab_cloud_restore_custom_options: "{{ case.vars.dblab_cloud_restore_custom_options | default(role_defaults.dblab_cloud_restore_custom_options) }}"
    dblab_cloud_skip_policies: "{{ case.vars.dblab_cloud_skip_policies | default(role_defaults.dblab_cloud_skip_policies) }}"
    dblab_cloud_restore_preprocess_sql: "{{ case.vars.dblab_cloud_restore_preprocess_sql | default(role_defaults.dblab_cloud_restore_preprocess_sql) }}"
    dblab_cloud_preload_libraries: "{{ case.vars.dblab_cloud_preload_libraries | default(role_defaults.dblab_cloud_preload_libraries) }}"

- name: Read it back
  ansible.builtin.slurp:
    src: "{{ render_dir }}/server.yml"
  register: rendered

- name: Parse it
  ansible.builtin.set_fact:
    rendered_text: "{{ rendered.content | b64decode }}"
    rendered_yaml: "{{ rendered.content | b64decode | from_yaml }}"

- name: "Assert: {{ case.name }}"
  vars:
    conn: "{{ rendered_yaml.retrieval.spec.logicalDump.options.source.connection }}"
    dbs: "{{ rendered_yaml.retrieval.spec.logicalDump.options.databases }}"
  ansible.builtin.assert:
    that:
      - conn.host == case.expect.host
      - conn.port | int == case.expect.port
      - conn.dbname == case.expect.dbname
      - conn.username == case.expect.username
      - (dbs | default({}, true) | list) == case.expect.databases
      - rendered_yaml.databaseContainer.dockerImage == case.expect.image
      - rendered_yaml.global.database.dbname == case.expect.dbname
      - "'s3cret-never-in-file' not in rendered_text"
    fail_msg: "{{ case.name }}: conn={{ conn }}, dbs={{ dbs }}, image={{ rendered_yaml.databaseContainer.dockerImage }}"
    quiet: true

- name: "Assert the profile: {{ case.name }}"
  when: case.expect.restore_options is defined
  vars:
    dump: "{{ rendered_yaml.retrieval.spec.logicalDump.options }}"
    restore: "{{ rendered_yaml.retrieval.spec.logicalRestore.options }}"
  ansible.builtin.assert:
    that:
      - dump.customOptions == case.expect.dump_options
      - restore.customOptions == case.expect.restore_options
      - restore.skipPolicies == case.expect.skip_policies
      - restore.queryPreprocessing.inline == case.expect.preprocess_sql
      - restore.configs.shared_preload_libraries == case.expect.preload
      - rendered_yaml.provision.dockerImage == case.expect.image
      - dump.dockerImage == case.expect.image
      - restore.dockerImage == case.expect.image
    fail_msg: >-
      {{ case.name }}: dump={{ dump.customOptions }}, restore={{ restore.customOptions }},
      skip={{ restore.skipPolicies }}, inline={{ restore.queryPreprocessing.inline }},
      preload={{ restore.configs.shared_preload_libraries }}
    quiet: true
...
