---

# Tests for the cloud deploy's decision logic (platform-all#876). Run from the repository root:
#
#   ansible-playbook tests/cloud-deploy/test.yml
#
# Localhost only; touches nothing but a temporary directory.

- name: "Cloud deploy | status report body"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    notify_tasks: "{{ playbook_dir }}/../../roles/deploy-notify/tasks"
  tasks:
    - name: Run the body cases
      ansible.builtin.include_tasks: run_body_case.yml
      loop:
        - name: "no row id: reporting is off"
          row_id: ""
          status: installing
          step: create_server
          expect_enabled: false
        - name: "a row id: the report carries it, as a number"
          row_id: "42"
          status: installing
          step: install_engine
          expect_enabled: true
          expect_instance_id: 42
        - name: "the server's address comes from dblab_host"
          row_id: "42"
          status: installing
          step: install_engine
          dblab_host: "root@203.0.113.7"
          expect_enabled: true
          expect_ip: "203.0.113.7"
        - name: "a long failure message is capped at 2000 characters"
          row_id: "42"
          status: failed
          step: retrieve_data
          error: "{{ 'x' * 5000 }}"
          expect_enabled: true
          expect_error_len: 2000
      loop_control:
        loop_var: case
        label: "{{ case.name }}"

- name: "Cloud deploy | retrieval outcome"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    classify_tasks: "{{ playbook_dir }}/../../roles/retrieval-wait/tasks"
    dblab_cloud_retrieval_timeout: 7200
  tasks:
    - name: Run the retrieval cases
      ansible.builtin.include_tasks: run_retrieval_case.yml
      loop:
        - name: "finished with a snapshot: done"
          status: { json: { retrieving: { status: finished } } }
          snapshots: { json: [{ id: "s1" }] }
          expect_state: done
        - name: "finished without a snapshot: failed, says so"
          status: { json: { retrieving: { status: finished } } }
          snapshots: { json: [] }
          expect_state: failed
          expect_message: "produced no snapshot"
        - name: "failed with the engine's alert: the alert is passed on"
          status: { json: { retrieving: { status: failed, alerts: { refresh_failed: { message: "pg_dump: connection refused" } } } } }
          snapshots: { json: [] }
          expect_state: failed
          expect_message: "pg_dump: connection refused"
        - name: "failed without an alert: still a readable message"
          status: { json: { retrieving: { status: failed } } }
          snapshots: { json: [] }
          expect_state: failed
          expect_message: "reported no details"
        - name: "still refreshing when the wait ends: a timeout naming the minutes and the state"
          status: { json: { retrieving: { status: refreshing } } }
          snapshots: { json: [] }
          expect_state: timeout
          expect_message: "within 120 minutes (last state: refreshing)"
        - name: "the engine never answered: a timeout with an unknown state"
          status: { status: -1, msg: "Connection refused" }
          snapshots: { status: -1 }
          expect_state: timeout
          expect_message: "last state: unknown"
        - name: "an error object instead of a snapshot list is not counted as snapshots"
          status: { json: { retrieving: { status: finished } } }
          snapshots: { json: { code: "UNAUTHORIZED", message: "bad token" } }
          expect_state: failed
          expect_message: "produced no snapshot"
      loop_control:
        loop_var: case
        label: "{{ case.name }}"

- name: "Cloud deploy | server.yml with a Platform-configured source"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../vars/main.yml
  vars:
    render_dir: "/tmp/dle-cloud-deploy-test"
  tasks:
    - name: Create the render directory
      ansible.builtin.file:
        path: "{{ render_dir }}"
        state: directory
        mode: "0700"

    - name: Keep the role's defaults under their own name, to compare against
      ansible.builtin.include_vars:
        file: ../../vars/main.yml
        name: role_defaults

    - name: Run the render cases
      ansible.builtin.include_tasks: run_render_case.yml
      loop:
        - name: "a source: connection, single database and the matching image"
          vars:
            dblab_cloud_source_host: "db.example.com"
            dblab_cloud_source_port: 6432
            dblab_cloud_source_dbname: "app db"
            dblab_cloud_source_username: "dblab_reader"
            dblab_cloud_source_password: "s3cret-never-in-file"
            dblab_cloud_postgres_version: "16"
          expect:
            host: "db.example.com"
            port: 6432
            dbname: "app db"
            username: "dblab_reader"
            databases: ["app db"]
            image: "postgresai/extended-postgres:16"
        - name: "no source: today's defaults, all databases"
          vars:
            dblab_cloud_source_host: ""
            dblab_cloud_source_password: ""
          expect:
            host: ""
            port: 5432
            dbname: "postgres"
            username: "postgres"
            databases: []
            image: "postgresai/extended-postgres:15"
        - name: "a source with no profile: today's dump and restore options"
          vars:
            dblab_cloud_source_host: "db.example.com"
            dblab_cloud_source_password: "s3cret-never-in-file"
          expect:
            host: "db.example.com"
            port: 5432
            dbname: "postgres"
            username: "postgres"
            databases: ["postgres"]
            image: "postgresai/extended-postgres:17"
            dump_options: null
            restore_options: ["--no-tablespaces", "--no-privileges", "--no-owner", "--exit-on-error"]
            skip_policies: true
            preprocess_sql: ""
            preload: "pg_stat_statements, pg_stat_kcache, auto_explain, logerrors"
        - name: "a Supabase profile: its image, options, policies, pre-restore SQL and preload libraries"
          vars:
            dblab_cloud_source_host: "aws-1-eu-central-1.pooler.supabase.com"
            dblab_cloud_source_username: "pgai_dblab_0a1b.ref"
            dblab_cloud_source_password: "s3cret-never-in-file"
            dblab_engine_db_image: "registry.gitlab.com/postgres-ai/se-images/supabase:17-0.8.0"
            dblab_cloud_dump_custom_options: ["--exclude-schema=x y"]
            dblab_cloud_restore_custom_options: ["--no-owner", "--exit-on-error"]
            dblab_cloud_skip_policies: false
            dblab_cloud_restore_preprocess_sql: "create role anon nologin; alter database \"postgres\" set search_path = \"$user\", public, extensions;"
            dblab_cloud_preload_libraries: "pg_stat_statements, pg_cron, pg_net"
          expect:
            host: "aws-1-eu-central-1.pooler.supabase.com"
            port: 5432
            dbname: "postgres"
            username: "pgai_dblab_0a1b.ref"
            databases: ["postgres"]
            image: "registry.gitlab.com/postgres-ai/se-images/supabase:17-0.8.0"
            dump_options: ["--exclude-schema=x y"]
            restore_options: ["--no-owner", "--exit-on-error"]
            skip_policies: false
            preprocess_sql: "create role anon nologin; alter database \"postgres\" set search_path = \"$user\", public, extensions;"
            preload: "pg_stat_statements, pg_cron, pg_net"
      loop_control:
        loop_var: case
        label: "{{ case.name }}"

    - name: Remove the render directory
      ansible.builtin.file:
        path: "{{ render_dir }}"
        state: absent

# Hetzner refuses to delete a volume while the server it was attached to is still being deleted
# (an internal server error, seen on a real destroy). The delete must retry until it goes through.
- name: "Cloud deploy | the destroy waits out the volume's detach"
  hosts: localhost
  gather_facts: false
  vars:
    delete_block: >-
      {{ (lookup('ansible.builtin.file', playbook_dir ~ '/../../roles/cloud-resources/tasks/hetzner.yml') | from_yaml)
         | selectattr('block', 'defined') | selectattr('when', 'defined') | selectattr('when', 'equalto', "state == 'absent'")
         | first }}
    volume_delete: >-
      {{ delete_block.block | selectattr('name', 'search', 'Delete volume') | first }}
  tasks:
    - name: "Assert: the volume delete retries until it succeeds"
      ansible.builtin.assert:
        that:
          - volume_delete.register is defined
          - (volume_delete.retries | default(0) | int) >= 10
          - (volume_delete.delay | default(0) | int) >= 5
          - volume_delete.until is defined and volume_delete.register in volume_delete.until
        fail_msg: "The volume delete does not retry: {{ volume_delete | to_json }}"
        quiet: true

# The engine token never reaches the task log: it comes from the environment, the request check
# refuses a missing one (no fallback to the default in vars/main.yml), and the usage block that
# prints it is off.
- name: "Cloud deploy | the engine token stays out of the task log"
  hosts: localhost
  gather_facts: false
  vars:
    plays: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../deploy_dle_cloud.yml') | from_yaml }}"
    request_check: >-
      {{ (plays | selectattr('name', 'equalto', 'Check the cloud deploy request') | first).tasks
         | selectattr('name', 'equalto', 'Check the variables the Platform must send') | first }}
    deploy_block: >-
      {{ ((plays | selectattr('name', 'equalto', 'Deploy DBLab Engine and Joe') | first).tasks | first).block }}
    settings: >-
      {{ (deploy_block | selectattr('name', 'equalto', 'Fix the settings every cloud server gets') | first)['ansible.builtin.set_fact'] }}
    engine_token_var: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/../../vars/main.yml') | from_yaml).dblab_cloud_engine_token | default('') }}"
  tasks:
    - name: "Assert: env token, required, usage block off"
      ansible.builtin.assert:
        that:
          - "'DBLAB_CLOUD_ENGINE_TOKEN' in engine_token_var"
          - "request_check['ansible.builtin.assert'].that | select('search', 'dblab_cloud_engine_token') | list | length == 1"
          - "settings.dblab_engine_verification_token is search('dblab_cloud_engine_token')"
          - "settings.print_usage_instructions == false"
        fail_msg: "settings={{ settings | to_json }}"
        quiet: true

# A deploy the Platform already failed or deleted stops before creating a server, and a refused
# 'finished' is reported as a failure (the Platform then removes the server) instead of left to time out.
- name: "Cloud deploy | refused reports stop the deploy"
  hosts: localhost
  gather_facts: false
  vars:
    plays: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../deploy_dle_cloud.yml') | from_yaml }}"
    notify_tasks: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../roles/deploy-notify/tasks/main.yml') | from_yaml }}"
    start_report: >-
      {{ (plays | selectattr('name', 'equalto', 'Check the cloud deploy request') | first).tasks
         | selectattr('name', 'equalto', 'Report the start') | first }}
    stop_task: "{{ notify_tasks | selectattr('name', 'equalto', 'Stop when the Platform no longer expects this deploy') | list }}"
    success: >-
      {{ (plays | selectattr('name', 'equalto', 'Report the outcome to the Platform') | first).tasks
         | selectattr('name', 'equalto', 'Report success') | first }}
  tasks:
    - name: "Assert: the start stops on 401/409; a refused finish reports failed"
      ansible.builtin.assert:
        that:
          - start_report.vars.deploy_notify_stop_when_refused | bool
          - stop_task | length == 1
          - stop_task[0].when | select('search', '401, 409') | list | length == 1
          - success.rescue is defined
          - (success.rescue | first).vars.deploy_notify_status == 'failed'
        fail_msg: "start={{ start_report | to_json }}"
        quiet: true

# On ansible-core 2.17 (the image's), a failing handler (the engine or Joe start) reaches the rescue
# with no failed task or message. The rescue then finds the reason itself (the containers' state)
# so the Platform never gets an empty failure.
- name: "Cloud deploy | a handler failure still reports a reason"
  hosts: localhost
  gather_facts: false
  vars:
    plays: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../deploy_dle_cloud.yml') | from_yaml }}"
    deploy_task: "{{ ((plays | selectattr('name', 'equalto', 'Deploy DBLab Engine and Joe') | first).tasks | first) }}"
    diag: "{{ deploy_task.rescue | selectattr('register', 'defined') | selectattr('register', 'equalto', 'deploy_diag') | list }}"
    mark: "{{ deploy_task.rescue | selectattr('name', 'equalto', 'Mark the deploy as failed') | first }}"
  tasks:
    - name: "Assert: the rescue inspects the containers when Ansible gives no reason, and uses it"
      ansible.builtin.assert:
        that:
          - diag | length == 1
          - diag[0].when is search('ansible_failed_task is not defined')
          - mark['ansible.builtin.set_fact'].deploy_error_msg is search('deploy_diag')
          - mark['ansible.builtin.set_fact'].deploy_failed_task is search('Start')
        fail_msg: "rescue={{ deploy_task.rescue | to_json }}"
        quiet: true

# platform-all#925: the Platform's GCP servers try zones b, c, a; deploy_dle.yml keeps zone b.
- name: "Cloud deploy | GCP project, zones and labels"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gcp_tasks: "{{ playbook_dir }}/../../roles/cloud-resources/tasks"
  tasks:
    - name: Run the GCP facts cases
      ansible.builtin.include_tasks: run_gcp_facts_case.yml
      loop:
        - name: "the Platform's server in a region: zones b, c, a; the account's project; owner labels"
          location: europe-west3
          per_server: true
          row_id: "7"
          org_id: "3"
          sa: '{"project_id": "acct-project"}'
          expect_zones: [europe-west3-b, europe-west3-c, europe-west3-a]
          expect_region: europe-west3
          expect_project: acct-project
          expect_labels: { env: dblab, server: dblab-3-7-abc123, pgai_org: "3", pgai_instance: "7" }
        - name: "the region's own zones (us-east1 has no zone a): b, c first, at most three"
          location: us-east1
          per_server: true
          region_zones: [us-east1-d, us-east1-c, us-east1-b]
          sa: '{"project_id": "acct-project"}'
          expect_zones: [us-east1-b, us-east1-c, us-east1-d]
          expect_region: us-east1
          expect_project: acct-project
          expect_labels: { env: dblab, server: dblab-3-7-abc123 }
        - name: "a region with zones a-f: b, c, then a"
          location: us-central1
          per_server: true
          region_zones: [us-central1-a, us-central1-b, us-central1-c, us-central1-f]
          sa: '{"project_id": "acct-project"}'
          expect_zones: [us-central1-b, us-central1-c, us-central1-a]
          expect_region: us-central1
          expect_project: acct-project
          expect_labels: { env: dblab, server: dblab-3-7-abc123 }
        - name: "a destroy looks in every zone of the region"
          location: us-central1
          per_server: true
          state: absent
          region_zones: [us-central1-a, us-central1-b, us-central1-c, us-central1-f]
          sa: '{"project_id": "acct-project"}'
          expect_zones: [us-central1-b, us-central1-c, us-central1-a, us-central1-f]
          expect_region: us-central1
          expect_project: acct-project
          expect_labels: { env: dblab, server: dblab-3-7-abc123 }
        - name: "deploy_dle.yml in a region: zone b only, no owner labels"
          location: us-central1
          per_server: false
          expect_zones: [us-central1-b]
          expect_region: us-central1
          expect_project: ""
          expect_labels: { env: dblab, server: dblab-3-7-abc123 }
        - name: "a zone is used as is; gcp_project wins over the account's"
          location: us-east1-c
          per_server: true
          gcp_project: chosen
          sa: '{"project_id": "acct-project"}'
          expect_zones: [us-east1-c]
          expect_region: us-east1
          expect_project: chosen
          expect_labels: { env: dblab, server: dblab-3-7-abc123 }
      loop_control:
        loop_var: case
        label: "{{ case.name }}"

# platform-all#925: an AWS or GCP destroy never calls Hetzner; the Hetzner calls retry.
- name: "Cloud deploy | destroy cleans Hetzner keys only on Hetzner"
  hosts: localhost
  gather_facts: false
  vars:
    plays: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../destroy_dle_cloud.yml') | from_yaml }}"
    destroy_block: "{{ (plays | first).tasks | selectattr('name', 'equalto', 'Destroy') | first }}"
    hetzner_block: "{{ destroy_block.block | selectattr('name', 'equalto', 'Remove the Hetzner SSH keys left by this server') | list }}"
  tasks:
    - name: "Assert: the key cleanup is one block, run for Hetzner only, and every call retries"
      ansible.builtin.assert:
        that:
          - hetzner_block | length == 1
          - hetzner_block[0].when is search("provision \| lower == 'hetzner'")
          - hetzner_block[0].block | length == 2
          - hetzner_block[0].block | selectattr('retries', 'defined') | list | length == 2
          - destroy_block.block | selectattr('hetzner.hcloud.hcloud_ssh_key_info', 'defined') | list | length == 0
        fail_msg: "destroy={{ destroy_block | to_json }}"
        quiet: true

# platform-all#925: the Platform's AWS and GCP servers get their own SSH-only firewall; deploy_dle.yml keeps the shared one.
- name: "Cloud deploy | per-server firewalls"
  hosts: localhost
  gather_facts: false
  vars:
    aws: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../roles/cloud-resources/tasks/aws.yml') | from_yaml }}"
    aws_blocks: "{{ aws | selectattr('block', 'defined') | selectattr('when', 'defined') | list }}"
    aws_create: "{{ (aws_blocks | selectattr('when', 'equalto', \"state == 'present'\") | list)[1].block }}"
    aws_delete: "{{ (aws_blocks | selectattr('when', 'equalto', \"state == 'absent'\") | first).block }}"
    own_sg: "{{ aws_create | selectattr('name', 'search', 'SSH only') | first }}"
    shared_sg: "{{ aws_create | selectattr('name', 'equalto', 'AWS: Create DBLab Security Group') | first }}"
    sg_delete: "{{ aws_delete | selectattr('name', 'search', 'Delete the security group') | first }}"
    gcp: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../roles/cloud-resources/tasks/gcp.yml') | from_yaml }}"
    gcp_blocks: "{{ gcp | selectattr('block', 'defined') | selectattr('when', 'defined') | list }}"
    gcp_delete: "{{ (gcp_blocks | selectattr('when', 'equalto', \"state == 'absent'\") | first).block }}"
    shared_rule_delete: "{{ gcp_delete | selectattr('name', 'equalto', \"GCP: Delete firewall rule 'dblab-allow-ssh'\") | first }}"
    own_rule_delete: "{{ gcp_delete | selectattr('name', 'search', '-ssh.$') | first }}"
  tasks:
    - name: "Assert: AWS opens only 22 on the server's own group and removes it; GCP removes only its own rule"
      ansible.builtin.assert:
        that:
          - own_sg['amazon.aws.ec2_security_group'].name is search('-sg')
          - own_sg['amazon.aws.ec2_security_group'].rules | length == 1
          - own_sg['amazon.aws.ec2_security_group'].rules[0].ports == [22]
          - shared_sg['amazon.aws.ec2_security_group'].name == 'dblab_engine_security_group'
          - sg_delete['amazon.aws.ec2_security_group'].state == 'absent'
          - sg_delete.when == 'dblab_cloud_per_server_firewall | bool'
          - sg_delete.retries is defined
          - shared_rule_delete.when == 'not dblab_cloud_per_server_firewall | bool'
          - own_rule_delete.when == 'dblab_cloud_per_server_firewall | bool'
        fail_msg: "own={{ own_sg | to_json }} shared={{ shared_sg | to_json }}"
        quiet: true

# platform-all#925: set_fact cannot override an extra-var, so the role never "replaces" a variable the
# Platform sends (the ubuntu-24.04 image name stayed in place and EC2 refused it).
- name: "Cloud deploy | no set_fact of a variable the Platform sends"
  hosts: localhost
  gather_facts: false
  vars:
    sent: [server_name, server_type, server_image, server_location, volume_size, server_network, provision]
    files: [aws.yml, gcp.yml, gcp_facts.yml, gcp_create_in_zone.yml, hetzner.yml, main.yml]
  tasks:
    - name: Collect every set_fact key in the cloud-resources tasks
      ansible.builtin.command:
        argv: "{{ ['python3', playbook_dir ~ '/set_fact_keys.py']
                  + (files | map('regex_replace', '^', playbook_dir ~ '/../../roles/cloud-resources/tasks/') | list) }}"
      register: set_fact_scan
      changed_when: false

    - name: Read them
      ansible.builtin.set_fact:
        set_keys: "{{ set_fact_scan.stdout | from_json }}"

    - name: "Assert: none of them is a variable the Platform sends"
      ansible.builtin.assert:
        that:
          - set_keys | length > 10
          - set_keys | intersect(sent) | list == ['server_network']
        fail_msg: "set_fact keys: {{ set_keys | unique | sort }}"
        quiet: true

# platform-all#925, found by the first GCP story deploy: an include's `when` is evaluated for every zone
# before any runs (so each zone created a server), and a module given service_account_contents masks
# the project id in what it returns (so a returned selfLink named project "********").
- name: "Cloud deploy | GCP stops at the first zone, and never reuses a returned selfLink"
  hosts: localhost
  gather_facts: false
  vars:
    tasks_dir: "{{ playbook_dir }}/../../roles/cloud-resources/tasks"
    zone_tasks: "{{ lookup('ansible.builtin.file', tasks_dir ~ '/gcp_create_in_zone.yml') | from_yaml }}"
    gcp_text: >-
      {{ lookup('ansible.builtin.file', tasks_dir ~ '/gcp.yml') ~ lookup('ansible.builtin.file', tasks_dir ~ '/gcp_create_in_zone.yml') }}
  tasks:
    - name: "Assert: one guarded block per zone; no selfLink taken from a module's result"
      ansible.builtin.assert:
        that:
          - zone_tasks | length == 1
          - zone_tasks[0].when == 'gcp_server_zone is not defined'
          - gcp_text is not search("attribute='selfLink'")
          # A skipped later zone overwrites its registered result: gcp.yml reads the fact the zone set.
          - lookup('ansible.builtin.file', tasks_dir ~ '/gcp.yml') is not search('server_result')
          - gcp_text is not search('source:\\s+"\\{\\{ gcp_disk_result \\}\\}"')
        fail_msg: "zone tasks: {{ zone_tasks | map(attribute='when', default='-') | list }}"
        quiet: true

# platform-all#925: a private RDS is checked before anything copies from it; a public one is not.
- name: "Cloud deploy | the PrivateLink gate runs before the engine, and only for a private RDS"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    plays: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../deploy_dle_cloud.yml') | from_yaml }}"
    steps: "{{ ((plays | selectattr('name', 'equalto', 'Deploy DBLab Engine and Joe') | first).tasks | first).block | map(attribute='name') | list }}"
  tasks:
    - name: "Assert: the gate comes after the packages and before the engine"
      ansible.builtin.assert:
        that:
          - "'Run role privatelink-gate' in steps"
          - steps.index('Run role privatelink-gate') > steps.index('Run role packages')
          - steps.index('Run role privatelink-gate') < steps.index('Run role dblab-engine')
        fail_msg: "steps: {{ steps }}"
        quiet: true

    - name: "Assert: the gate waits for a new endpoint to pass traffic before judging the certificate"
      ansible.builtin.assert:
        that:
          - (gate | selectattr('name', 'equalto', "Read the server certificate's names") | first).retries | int >= 6
          - (gate | selectattr('name', 'equalto', "Read the server certificate's names") | first).until is defined
        quiet: true
      vars:
        gate: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/../../roles/privatelink-gate/tasks/main.yml') | from_yaml | first).block }}"

    - name: A public source runs no check
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../roles/privatelink-gate"
      vars:
        dblab_cloud_privatelink: { }

