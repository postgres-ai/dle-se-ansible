---
# Server
provision: none  # or 'aws', 'gcp', 'azure', 'digitalocean', 'hetzner' to create a virtual machine for DBLab Engine

# System
username: "root"  # system user, owner of configuration files

# ZFS pool
zpool_disk: ""  # specify an empty disk for the ZFS pool (e.g.: /dev/sdb). If not specified, an attempt will be made to automatically detect an empty volume.
zpool_name: "dblab_pool"
zpool_mount_dir: "/var/lib/dblab"
zpool_options: "-O compression=on -O atime=off -O recordsize=128k -O logbias=throughput"
# Note: For a physical mode with a sync instance (physicalRestore.sync.enabled: true in DBLab config), consider a smaller 'recordsize' value like '8k'.
# While 'recordsize=128k' enhances compression and performance for large-scale IO operations like index creation,
# it may reduce WAL replay efficiency, potentially leading to increased lag.
zpool_datasets_number: 2  # number of datasets for the ZFS pool. When the DBLab Engine is deployed, you can increase the number of datasets (if necessary).
zpool_datasets_name: "dataset"  # base name for ZFS datasets. Suffixes (01, 02, etc.) are appended based on `zpool_datasets_number`.

# DBLab Engine
dblab_engine_verification_token: "some-secret-token"
dblab_engine_base_path: "/root/.dblab"
dblab_engine_config_path: "{{ dblab_engine_base_path }}/engine/configs"
dblab_engine_meta_path: "{{ dblab_engine_base_path }}/engine/meta"
dblab_engine_logs_path: "{{ dblab_engine_base_path }}/engine/logs"
dblab_engine_dump_location: "{{ zpool_mount_dir }}/{{ zpool_name }}/{{ zpool_datasets_name }}_1/dump"  # Use a dataset directory for dumping data
dblab_engine_port: 2345
dblab_engine_version: 3.5.0
dblab_engine_image: "postgresai/dblab-server:{{ dblab_engine_version | replace('v', '') }}"
dblab_engine_ui_version: "{{ dblab_engine_version | replace('v', '') }}"
dblab_engine_ui_image: "postgresai/ce-ui:{{ dblab_engine_ui_version }}"
dblab_engine_ui_port: 2346
dblab_engine_clone_port_pool:
  from: 6000
  to: 6100
dblab_engine_clone_access_addresses: "127.0.0.1"  # IP addresses that can be used to access clones.
dblab_engine_computing_infrastructure: "{{ provision }}"
dblab_engine_container_host: 127.0.0.1
dblab_engine_container_name: dblab_server
dblab_engine_container_default_volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  - /var/lib/dblab:/var/lib/dblab/:rshared
  - "{{ dblab_engine_config_path }}:/home/dblab/configs"
  - "{{ dblab_engine_meta_path }}:/home/dblab/meta"
  - "{{ dblab_engine_logs_path }}:/home/dblab/logs"
dblab_engine_container_additional_volumes: []
#  - "{{ dblab_engine_base_path }}/preprocess.sh:/tmp/preprocess.sh"
#  - "/etc/wal-g.d/gcs.json:/tmp/sa.json:rshared"
dblab_engine_start_timeout: 300  # Maximum wait time for DBLab Engine availability after startup.

# Platform
platform_project_name: ""  # Project name
platform_org_key: ""  # Organization key

# DBLab agent (inverted mode: the DBLab server calls the Platform)
# The agent registers this engine with the Platform, stores the per-instance
# token it is given and then asks the Platform for work. Nothing dials in, so
# the server needs no public address and no open port. See platform-all#811.
dblab_agent_install: false  # do not install the agent by default; inverted mode is an explicit choice
# NOTE: no RELEASED image carries the DBLab channel yet - it lives on postgresai
# feature/dblab-call-channel. Until that ships, set this to a build of that branch;
# an agent without the channel reads no dblab_token, idles and reports unhealthy.
dblab_agent_version: "0.17.0-rc.4"
dblab_agent_image: "postgresai/instance-jobs:{{ dblab_agent_version | replace('v', '') }}"
dblab_agent_container_name: dblab_agent
dblab_agent_config_path: "{{ dblab_engine_base_path }}/agent"  # holds '.pgwatch-config', the agent's only file
# The agent image runs as its own unprivileged user (uid 1001). '.pgwatch-config' is 0600, so the
# container has to BE that owner: a mismatch is reported as "config unreadable; check its owner and mode".
dblab_agent_uid: 1001
dblab_agent_gid: 1001
dblab_agent_cpus: 0.25
dblab_agent_memory: "256M"
# The engine as the agent addresses it. The two run on the same box, so this is loopback and plain
# http is the norm - the request never leaves the machine.
dblab_agent_dblab_url: "http://{{ dblab_engine_container_host }}:{{ dblab_engine_port }}"
# The Platform the agent registers with and polls. Kept identical to what the engine config renders,
# so the two never disagree about which Platform this box belongs to.
dblab_agent_api_base_url: "{{ platform_url | default('https://postgres.ai/api/general') }}"
# Also write the token into the engine's 'platform.accessToken'. OFF until the Platform accepts
# an instance-scoped token there: v1.dblab_token_check calls api_token_check without
# allow_dblab_scope, so it answers PT403, and the engine REFUSES TO START on a token that check
# rejects (platform.New -> log.Errf -> return). The agent's own channel is unaffected: it
# authenticates through dblab_instance_token_auth, which does allow the scope.
dblab_agent_set_engine_token: false

# CLI
cli_install: true
cli_version: "{{ dblab_engine_version | replace('v', '') }}"
cli_environment_id: "{{ platform_project_name }}"

# Joe Bot
joe_bot_install: false # do not install Joe Bot by default
joe_version: 0.11.0-rc.5
joe_config_path: "{{ dblab_engine_base_path }}/joe/configs"
joe_meta_path: "{{ dblab_engine_base_path }}/joe/meta"
joe_image: "postgresai/joe:{{ joe_version | replace('v', '') }}"
joe_container_name: joe_bot
joe_container_host: 127.0.0.1
joe_port: 2400
joe_platform_token: "platform_secret_token" # Postgres.ai Platform API secret token.
joe_communication_type: "webui" # Available communication types ('webui', 'slack', 'slackrtm', 'slacksm')
joe_communication_signing_secret: "secret_signing" # Web UI Signing Secret.
joe_communication_slack_signing_secret: "secret_signing" # Slack App Signing Secret.
joe_communication_slack_access_token: "xoxb-XXXX" # Bot User OAuth Access Token.
joe_communication_slack_app_level_token: "xapp-XXXX" # App Level Token (for "slacksm").
joe_communication_channels_channel_id: "{{ platform_project_name }}" # Web UI channel ID.
joe_communication_channels_project: "{{ platform_project_name }}" # Postgres.ai Platform project to which user sessions are to be assigned.
# PostgreSQL connection parameters used to connect Joe to the clone
joe_dblab_params_dbname: "postgres"
joe_dblab_params_sslmode: "prefer"

# Joe agent (inverted mode: the Joe on this server calls the Platform)
# The same 'instance-jobs' image as the DBLab agent, run a second time with a Joe
# configuration: it asks the Platform for Joe work and hands each command to the
# Joe on this server over Joe's '/webui/' surface. Nothing dials in, so Joe needs
# no public address and no open port. The two agents are independent - a server
# can run either, both or neither.
joe_agent_install: false  # do not install the agent by default; inverted mode is an explicit choice
# One image serves both channels, so one version per server. Override to pin Joe's
# agent to a different build than the DBLab agent's.
# NOTE: there is no separate Joe image - the same 'instance-jobs' image serves
# both channels, and no released tag carries the Joe channel yet: it arrives with
# postgresai!445. Until a tag has it, set this to a build of that branch; an agent
# without the channel reads no joe_token, idles and reports unhealthy.
joe_agent_version: "{{ dblab_agent_version }}"
joe_agent_image: "postgresai/instance-jobs:{{ joe_agent_version | replace('v', '') }}"
joe_agent_container_name: joe_agent
joe_agent_config_path: "{{ dblab_engine_base_path }}/joe-agent"  # holds '.pgwatch-config', the agent's only file
# The agent image runs as its own unprivileged user (uid 1001). '.pgwatch-config' is 0600, so the
# container has to BE that owner: a mismatch is reported as "config unreadable; check its owner and mode".
joe_agent_uid: 1001
joe_agent_gid: 1001
# Set for this container rather than inherited from the DBLab agent's: the two run side by side and
# are budgeted separately.
joe_agent_cpus: 0.25
joe_agent_memory: "256M"
# Joe as the agent addresses it. The two run on the same server, so this is loopback and plain http
# is the norm - the request never leaves the machine. A base address only: the agent appends Joe's
# '/webui/' path itself.
joe_agent_joe_url: "http://{{ joe_container_host }}:{{ joe_port }}"
# The Platform the agent polls for Joe work. Kept identical to what Joe's own configuration renders,
# so the two never disagree about which Platform this server belongs to.
joe_agent_api_base_url: "{{ platform_url | default('https://postgres.ai/api/general') }}"
# The id this box is recognised by on its next boot. The DBLab Engine assigns itself one on first
# boot; reusing it gives the box ONE identity, and Joe's registration finds-or-creates on it in a
# different table from the engine's, so the two never collide. Override only for a box whose Joe
# must be a separate instance from its engine.
joe_agent_instance_id_file: "{{ dblab_engine_meta_path }}/instance_id"
# The secret the agent signs each call to Joe with. Joe answers an unsigned or wrongly signed
# request with 403, so this has to be the secret Joe itself holds - by default the very same
# variable Joe's own configuration is rendered from. Rendered into the agent's configuration as
# 'joe_verify_token', which is named for symmetry with 'dblab_verify_token' and is the signing key
# rather than anything the agent sends.
joe_agent_signing_secret: "{{ joe_communication_signing_secret }}"
# How long to wait for Joe's API port after starting. Joe is started by the 'joe-bot' role in the
# same play, or was already running when this role is reached through '--tags joe-agent'.
joe_agent_joe_start_timeout: 60

# Monitoring

# Netdata - https://github.com/netdata/netdata
netdata_install: true
netdata_version: 1.47.5-1
netdata_image: "postgresai/netdata-for-dle:v{{ netdata_version | replace('v', '') }}"
netdata_port: 19999

# Proxy
proxy_install: false # Set "true" to install Envoy proxy and issue Let's Encrypt certificate
proxy_version: 1.32 # Envoy proxy version
proxy_dblab_engine_public_port: 443
proxy_joe_public_port: 444
certbot_install_method: pip
certbot_install_version: 3.0.1
certbot_create_if_missing: true
certbot_create_method: standalone
certbot_auto_renew: true
certbot_auto_renew_user: "{{ username | default(lookup('env', 'USER')) }}"
certbot_auto_renew_hour: "3"
certbot_auto_renew_minute: "30"
certbot_admin_email: "" # Email to issue certificate, for example, admin@example.com
certbot_domain: "" # Domain to issue certificate, for example, example.com
certbot_certs:
  - email: "{{ certbot_admin_email }}"
    domains:
      - "{{ certbot_domain }}"

# Usage instructions
print_usage_instructions: true # Print the usage instructions after deployment

...
