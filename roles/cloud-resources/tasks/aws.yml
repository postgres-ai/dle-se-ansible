---
# Dependencies
- name: Install Python dependencies
  block:
    - name: Ensure that 'python3-pip' package is present on controlling host
      ansible.builtin.package:
        name: python3-pip
        state: present
      register: package_status
      until: package_status is success
      delay: 10
      retries: 3
      delegate_to: 127.0.0.1
      run_once: true
      when: ansible_distribution != "MacOSX"

    - name: Ensure that 'boto3' dependency is present on controlling host
      ansible.builtin.pip:
        name: boto3
        extra_args: --user
      environment:
        PIP_BREAK_SYSTEM_PACKAGES: "1"
      delegate_to: 127.0.0.1
      become: false
      vars:
        ansible_become: false
      run_once: true

# Tags: the Platform's ids on a cloud deploy, so its servers can be found by owner.
- name: "Set variable: aws_resource_tags"
  ansible.builtin.set_fact:
    aws_resource_tags: >-
      {{ {'env': 'dblab', 'server': server_name | lower}
         | combine({'pgai_org': dblab_cloud_org_id | string, 'pgai_instance': dblab_cloud_row_id | string}
                   if dblab_cloud_row_id | default('', true) | string | length > 0 else {}) }}

# SSH key
- block:
    # Delete the temporary ssh key from the cloud (if exists)
    - name: "AWS: Remove temporary SSH key '{{ ssh_key_name }}' from cloud (if any)"
      amazon.aws.ec2_key:
        access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
        name: "{{ ssh_key_name }}"
        region: "{{ server_location }}"
        state: absent
      when:
        - ssh_key_name is defined
        - dblab_tmp_ssh_key_name is defined
        - ssh_key_name == dblab_tmp_ssh_key_name

    # if ssh_key_name and ssh_key_content is specified, add this ssh key to the cloud
    - name: "AWS: Add SSH key '{{ ssh_key_name }}' to cloud"
      amazon.aws.ec2_key:
        access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
        name: "{{ ssh_key_name }}"
        key_material: "{{ ssh_key_content }}"
        region: "{{ server_location }}"
        state: present
        resource_tags: "{{ aws_resource_tags }}"
      register: ssh_key_result
      when:
        - ssh_key_name | length > 0
        - ssh_key_content | length > 0
  when: state == 'present'

# Create (if state is present)
- block:
    # An image name instead of an AMI id: the current Ubuntu 24.04 AMI of this region. A new
    # variable: set_fact cannot override server_image when it comes as an extra-var.
    - name: "AWS: Find the Ubuntu 24.04 AMI in '{{ server_location }}'"
      ansible.builtin.set_fact:
        aws_ami_id: >-
          {{ lookup('amazon.aws.ssm_parameter',
                    '/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id',
                    region=server_location)
             if server_image == 'ubuntu-24.04' else server_image }}

    # The Platform's servers: a default-VPC subnet in a zone that offers the instance type.
    - name: "AWS: Find a subnet whose zone offers '{{ server_type }}'"
      ansible.builtin.script:
        cmd: "aws_pick_subnet.py {{ server_location | quote }} {{ server_type | quote }}"
        executable: python3
      register: aws_subnet_pick
      changed_when: false
      when:
        - dblab_cloud_per_server_firewall | bool
        - server_network | length < 1

    - name: "AWS: Use the subnet found"
      ansible.builtin.set_fact:
        aws_subnet_choice: "{{ aws_subnet_pick.stdout | from_json }}"
      when: aws_subnet_pick.stdout is defined

    - name: "AWS: Stop when no subnet fits"
      ansible.builtin.fail:
        msg: "{{ aws_subnet_choice.error }}"
      when: aws_subnet_choice.error is defined

    - name: "Set variable: vpc_id, server_network"
      ansible.builtin.set_fact:
        vpc_id: "{{ aws_subnet_choice.vpc_id }}"
        server_network: "{{ aws_subnet_choice.subnet_id }}"
      when: aws_subnet_choice.subnet_id is defined

    # if server_network is specified, get vpc id for this subnet
    - name: "AWS: Gather information about VPC for '{{ server_network }}'"
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ server_location }}"
        subnet_ids: "{{ server_network }}"
      register: vpc_subnet_info
      when:
        - server_network | length > 0
        - aws_subnet_choice.subnet_id is not defined

    - name: "Set variable: vpc_id"
      ansible.builtin.set_fact:
        vpc_id: "{{ vpc_subnet_info.subnets[0].vpc_id }}"
      when:
        - server_network | length > 0
        - vpc_subnet_info.subnets[0].vpc_id is defined

    # if server_network is not specified, use default vpc subnet
    - name: "AWS: Gather information about default VPC"
      amazon.aws.ec2_vpc_net_info:
        region: "{{ server_location }}"
        filters:
          "is-default": true
      register: vpc_info
      when: server_network | length < 1

    - name: "AWS: Gather information about VPC subnet for default VPC"
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ server_location }}"
        filters:
          vpc-id: "{{ vpc_info.vpcs[0].id }}"
      register: vpc_subnet_info
      when:
        - server_network | length < 1
        - vpc_info.vpcs[0].id is defined

    - name: "Set variable: vpc_id"
      ansible.builtin.set_fact:
        vpc_id: "{{ vpc_info.vpcs[0].id }}"
      when:
        - server_network | length < 1
        - vpc_info.vpcs[0].id is defined

    - name: "Set variable: server_network"
      ansible.builtin.set_fact:
        server_network: "{{ vpc_subnet_info.subnets[0].id }}"
      when:
        - server_network | length < 1
        - vpc_subnet_info.subnets[0].id is defined

    # Fail early if an instance with this name already exists.
    - name: "AWS: Check if instance '{{ server_name }}' already exists"
      amazon.aws.ec2_instance_info:
        access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
        region: "{{ server_location }}"
        filters:
          "tag:Name": "{{ server_name | lower }}"
          "instance-state-name":
            - running
            - stopped
      register: existing_instance_check

    - name: "AWS: Fail if instance '{{ server_name }}' already exists"
      ansible.builtin.fail:
        msg: >-
          An EC2 instance named '{{ server_name }}' already exists
          (IP: {{ existing_instance_check.instances[0].public_ip_address | default('N/A') }},
          ID: {{ existing_instance_check.instances[0].instance_id | default('N/A') }}).
          Please choose a different server name or terminate the existing instance
          from the AWS console before retrying.
      when: existing_instance_check.instances | length > 0

    # Security Group: the Platform's servers get their own, SSH only, removed with the server.
    - name: "AWS: Create the security group '{{ server_name | lower }}-sg' (SSH only)"
      amazon.aws.ec2_security_group:
        access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
        name: "{{ server_name | lower }}-sg"
        state: present
        description: "SSH to the DBLab server {{ server_name | lower }}"
        vpc_id: "{{ vpc_id }}"
        region: "{{ server_location }}"
        rules:
          - proto: tcp
            ports:
              - 22
            cidr_ip: 0.0.0.0/0
        resource_tags: "{{ aws_resource_tags }}"
      when: dblab_cloud_per_server_firewall | bool

    - name: "AWS: Create DBLab Security Group"
      when: not dblab_cloud_per_server_firewall | bool
      amazon.aws.ec2_security_group:
        name: dblab_engine_security_group
        state: present
        description: Enable ports to access DBLab Engine
        vpc_id: "{{ vpc_id }}"
        region: "{{ server_location }}"
        rules:
          - proto: tcp
            ports:
              - 22
              - "{{ proxy_dblab_engine_public_port }}"
              - "{{ dblab_engine_port }}"
              - "{{ dblab_engine_ui_port }}"
              - "{{ netdata_port }}"
            cidr_ip: 0.0.0.0/0
        resource_tags:
          env: dblab

    # Instance and volume
    - name: "AWS: Create or modify EC2 instance '{{ server_name }}'"
      amazon.aws.ec2_instance:
        access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
        name: "{{ server_name | lower }}"
        state: present
        instance_type: "{{ server_type }}"
        image_id: "{{ aws_ami_id }}"
        key_name: "{{ ssh_key_name }}"
        region: "{{ server_location }}"
        security_group: "{{ (server_name | lower ~ '-sg') if dblab_cloud_per_server_firewall | bool else 'dblab_engine_security_group' }}"
        vpc_subnet_id: "{{ server_network }}"
        network:
          assign_public_ip: true
          delete_on_termination: true
        volumes:
          - device_name: /dev/sda1
            ebs:
              volume_type: gp3
              volume_size: "{{ system_volume_size }}"  # system disk size
              delete_on_termination: true
          - device_name: /dev/sdb
            ebs:
              volume_type: "{{ volume_type if volume_type | default('', true) | length > 0 else 'gp3' }}"
              volume_size: "{{ volume_size | int }}"
              delete_on_termination: true
        resource_tags: "{{ aws_resource_tags }}"
      register: ec2_result
      until:
        - ec2_result.instances[0].public_ip_address is defined
        - ec2_result.instances[0].public_ip_address | length > 0
      retries: 30
      delay: 10
  when: state == 'present'

# Info
- name: Show EC2 instance info
  ansible.builtin.debug:
    msg:
      - instance ID is {{ ec2_result.instances[0].instance_id }}
      - instance Image is {{ ec2_result.instances[0].image_id }}
      - instance Name is {{ ec2_result.instances[0].tags.Name }}
      - instance Type is {{ ec2_result.instances[0].instance_type }}
      - Block Storage Size is {{ volume_size }} gigabytes
      - Public IP is {{ ec2_result.instances[0].public_ip_address }}
      - Private IP is {{ ec2_result.instances[0].private_ip_address }}
  when: ec2_result.instances is defined

# set_fact: dblab_host
- name: "Set variable: dblab_host (for deploy DBLab Engine)"
  ansible.builtin.set_fact:
    dblab_host: "ubuntu@{{ ec2_result.instances[0].public_ip_address }}"
  when: ec2_result.instances is defined

- name: "Wait for SSH port on '{{ dblab_host }}'"
  ansible.builtin.wait_for:
    host: "{{ ec2_result.instances[0].public_ip_address }}"
    port: 22
    delay: 5
    timeout: 300
  become_user: ubuntu
  when: ec2_result.instances is defined

# The port check succeeds as soon as sshd starts, but cloud-init may not have
# written the SSH key to authorized_keys yet. Retry actual SSH authentication.
- name: "Verify SSH authentication to '{{ dblab_host }}'"
  ansible.builtin.command:
    cmd: >-
      ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o BatchMode=yes
      -i ~/.ssh/{{ dblab_tmp_ssh_key_name }}
      {{ dblab_host }} true
  register: ssh_auth_check
  retries: 15
  delay: 5
  until: ssh_auth_check.rc == 0
  changed_when: false
  when:
    - ec2_result.instances is defined
    - dblab_tmp_ssh_key_name is defined

# Delete the temporary ssh key from the cloud after creating the EC2 instance
- name: "AWS: Remove temporary SSH key '{{ ssh_key_name }}' from cloud"
  amazon.aws.ec2_key:
    access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
    secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
    name: "{{ ssh_key_name }}"
    region: "{{ server_location }}"
    state: absent
  register: ssh_key_result
  when:
    - ssh_key_name is defined
    - dblab_tmp_ssh_key_name is defined
    - ssh_key_name == dblab_tmp_ssh_key_name

# Delete (if state is absent)
- block:
    - name: "AWS: Delete EC2 instance '{{ server_name }}'"
      amazon.aws.ec2_instance:
        access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
        name: "{{ server_name | lower }}"
        region: "{{ server_location }}"
        state: absent
        wait: true

    # A deploy that died before removing its temporary key leaves it tagged with the server.
    - name: "AWS: Remove SSH keys left by '{{ server_name }}'"
      ansible.builtin.script:
        cmd: "aws_delete_server_keys.py {{ server_location | quote }} {{ server_name | lower | quote }}"
        executable: python3
      register: aws_leftover_keys
      changed_when: aws_leftover_keys.stdout | trim | length > 0
      when: dblab_cloud_per_server_firewall | bool

    # The group stays attached until the instance is gone.
    - name: "AWS: Delete the security group '{{ server_name | lower }}-sg'"
      amazon.aws.ec2_security_group:
        access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
        name: "{{ server_name | lower }}-sg"
        region: "{{ server_location }}"
        state: absent
      register: aws_sg_deleted
      until: aws_sg_deleted is succeeded
      retries: 12
      delay: 10
      when: dblab_cloud_per_server_firewall | bool
  when: state == 'absent'

...
