---

# Issue a SIGHUP signal to the main process in the DBLab Engine container.
# Note that kill here is not killing the process, it just sends the SIGHUP signal to it.
#
# The engine rebuilds its Platform client on SIGHUP, so a server already serving
# clones keeps serving them. Its own topic rather than zpool's 'reload
# dblab_server' so that it is tag-eligible under '--tags dblab-agent'.
- name: Reload DBLab Engine to apply the Platform access token
  ansible.builtin.command: "docker exec {{ dblab_engine_container_name }} kill -SIGHUP 1"
  listen: "reload dblab_server for the agent token"
  register: dblab_agent_reload_result
  failed_when: dblab_agent_reload_result.rc != 0 and "No such container" not in dblab_agent_reload_result.stderr

...
