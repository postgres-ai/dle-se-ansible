---

- block:
    # A fresh box's network is sometimes briefly unreachable (#35): pull first when missing, retried.
    - name: Pull the DBLab Engine image (retried)
      community.docker.docker_image:
        name: "{{ dblab_engine_image }}"
        source: pull
      register: _pull_dblab_engine_image
      until: _pull_dblab_engine_image is succeeded
      retries: 4
      delay: 20

    # A fresh box's network is sometimes briefly unreachable (#35): pull first when missing, retried.
    - name: Pull the DBLab UI (the engine starts it) image (retried)
      community.docker.docker_image:
        name: "{{ dblab_engine_ui_image }}"
        source: pull
      register: _pull_dblab_engine_ui_image
      until: _pull_dblab_engine_ui_image is succeeded
      retries: 4
      delay: 20

    # A fresh box's network is sometimes briefly unreachable (#35): pull first when missing, retried.
    - name: Pull the extended Postgres (the engine starts it) image (retried)
      community.docker.docker_image:
        name: "{{ dblab_engine_db_image }}"
        source: pull
      register: _pull_dblab_engine_db_image
      until: _pull_dblab_engine_db_image is succeeded
      retries: 4
      delay: 20

    - name: Restart DBLab server container
      community.docker.docker_container:
        name: "{{ dblab_engine_container_name }}"
        image: "{{ dblab_engine_image }}"
        state: started
        restart: true
        privileged: true
        restart_policy: unless-stopped
        container_default_behavior: "compatibility"
        volumes: "{{ docker_container_volumes }}"
        ports:
          - "{{ dblab_engine_container_host }}:{{ dblab_engine_port }}:2345"
        # PGPASSWORD outranks 'password' in server.yml, so the source password never lands in a file.
        env: >-
          {{ {'DOCKER_API_VERSION': '1.39',
              'DLE_COMPUTING_INFRASTRUCTURE': dblab_engine_computing_infrastructure}
             | combine({'PGPASSWORD': dblab_cloud_source_password}
                       if dblab_cloud_source_host | default('', true) | length > 0
                          and dblab_cloud_source_password | default('', true) | length > 0
                       else {}) }}
      vars:
        docker_container_volumes: "{{ dblab_engine_container_default_volumes + dblab_engine_container_additional_volumes }}"
      no_log: "{{ dblab_cloud_source_password | default('', true) | length > 0 }}"  # env carries PGPASSWORD

    - name: Wait for DBLab Engine API port to be available
      ansible.builtin.wait_for:
        port: "{{ dblab_engine_port }}"
        host: "localhost"
        state: started
        timeout: "{{ dblab_engine_start_timeout | default(300) }}"
        delay: 10
      ignore_errors: false

    - name: Ensure DBLab Engine API is healthy
      ansible.builtin.uri:
        url: "http://localhost:{{ dblab_engine_port }}/healthz"
      register: _result
      until: _result.status == 200
      retries: "{{ (dblab_engine_start_timeout | default(300)) // 10 }}"
      delay: 10

    - name: Ensure DBLab Engine UI is available
      ansible.builtin.wait_for:
        port: "{{ dblab_engine_ui_port }}"
        host: "localhost"
        state: started
        timeout: "{{ dblab_engine_start_timeout | default(300) }}"
        delay: 10
      ignore_errors: false

...
