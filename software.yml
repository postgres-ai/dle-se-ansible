---

- name: Add host to dblab_group
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Add {{ dblab_host }} to dblab_group
      ansible.builtin.add_host:
        name: "{{ dblab_host }}"
        groups: dblab_group
      changed_when: false
      when: dblab_host is defined and dblab_host | length > 1
      tags: always

# add the path to the temporary ssh key if it is used
- name: Set facts for dblab_group
  hosts: dblab_group
  gather_facts: false
  tasks:
    - name: "Set variable: ansible_ssh_private_key_file"
      ansible.builtin.set_fact:
        ansible_ssh_private_key_file: "~{{ lookup('env', 'USER') }}/.ssh/{{ hostvars['localhost']['dblab_tmp_ssh_key_name'] }}"
      when:
        - hostvars['localhost']['ssh_key_name'] is defined
        - hostvars['localhost']['ssh_key_name'] == hostvars['localhost']['dblab_tmp_ssh_key_name']
      tags: always

- name: Deploy and configure DBLab Engine software
  hosts: dblab_group
  become: true
  become_method: sudo
  gather_facts: true
  any_errors_fatal: true
  environment: "{{ proxy_env | default({}) }}"
  vars:
    minimal_ansible_version: 2.11.0
    minimal_dblab_engine_version: 3.4.0
  pre_tasks:
    - name: Common preparation
      ansible.builtin.import_tasks: tasks/software_pre_tasks.yml

  roles:
    # Prepare system
    - role: authorized-keys
    - role: add-repository
    - role: packages
    - role: zpool

    # Configure and start DBLab Engine
    - role: dblab-engine
    - role: dblab-cli

    # DBLab agent (inverted mode: the DBLab server calls the Platform)
    - role: dblab-agent
      when: dblab_agent_install | bool
      tags: dblab-agent

    # Joe Bot
    - role: joe-bot
      when: joe_bot_install | bool

    # Joe agent (inverted mode: the Joe on this server calls the Platform).
    # After 'joe-bot': the agent waits for the Joe it is going to serve.
    - role: joe-agent
      when: joe_agent_install | bool
      tags: joe-agent

    # Proxy server
    - role: proxy

    # Monitoring
    - role: netdata

    # finish (connection info)
    - role: deploy-finish

...
